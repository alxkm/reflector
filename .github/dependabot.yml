version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # JUnit 6 requires Java 17 at compile and at run time, and publishes no variant
      # this project can consume while it supports Java 8. Revisit when the baseline moves.
      - dependency-name: "org.junit:junit-bom"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
